<!DOCTYPE html>
<html>

<head>
    <title>Workday AI Assistant</title>

    <style>

        body {
            font-family: Arial;
            margin: 40px;
        }

        h1 {
            color: #0078d4;
        }

        input {
            padding: 8px;
            width: 250px;
        }

        button {
            padding: 8px;
            margin-left: 5px;
        }

        #result {
            margin-top: 20px;
            border: 1px solid #ddd;
            padding: 15px;
            min-height: 50px;
        }

    </style>

</head>

<body>

    <h1>Workday AI Assistant</h1>

    <button onclick="loadEmployees()">
        Load Employees
    </button>

    <br><br>

    <input
        type="text"
        id="employeeName"
        placeholder="Enter employee first name">

    <button onclick="searchEmployee()">
        Search Employee
    </button>

    <div id="result">
        No data loaded.
    </div>

    <script src="script.js"></script>

</body>

</html>
